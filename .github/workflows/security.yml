name: Security

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OSV Scanner
        id: osv
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v2.2.2
        with:
          scan-args: |-
            --lockfile=./package-lock.json
      - name: OSV — scanner indisponible
        if: steps.osv.outcome == 'failure' && steps.osv.conclusion == 'failure'
        run: |
          echo "OSV a signalé des findings ou une erreur : voir l'étape précédente." >> "$GITHUB_STEP_SUMMARY"

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        run: semgrep scan --config p/javascript --config p/typescript --config p/react --severity ERROR --error
