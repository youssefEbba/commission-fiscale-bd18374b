name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy frontend locally
        run: |
          set -e

          cd /home/mf/commission-fiscale-bd18374b

          cp src/lib/apiConfig.ts /home/mf/apiConfig.ts.frontend.server || true
          cp nginx.conf /home/mf/nginx.conf.frontend.server || true
          cp Dockerfile /home/mf/Dockerfile.frontend.server || true

          git fetch origin main
          git reset --hard origin/main

          cp /home/mf/apiConfig.ts.frontend.server src/lib/apiConfig.ts || true
          cp /home/mf/nginx.conf.frontend.server nginx.conf || true
          cp /home/mf/Dockerfile.frontend.server Dockerfile || true

          cd /home/mf/commission-fiscale-deploy
          sudo docker compose up -d --build frontend
          sudo docker ps
          curl -I http://127.0.0.1:8082 || true
